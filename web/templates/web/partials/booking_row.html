<tr id="booking-{{ booking.pk }}">
  <td>{{ booking.slot.service.name }}</td>
  <td>{{ booking.slot.start_time|date:"d/m/Y H:i" }}</td>
  <td>{{ booking.get_status_display }}</td>
  <td>
    {% if booking.status != 'cancelled' %}
      <button hx-post="{% url 'cancel_booking' booking.pk %}"
              hx-target="#booking-{{ booking.pk }}"
              hx-swap="outerHTML"
              class="secondary">
        Cancel
      </button>
    {% endif %}
  </td>
</tr>
