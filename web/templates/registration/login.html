{% extends 'web/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
  </form>
  <p>Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
{% endblock %}
